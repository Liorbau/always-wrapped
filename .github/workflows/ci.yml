# Deterministic quality gate for Always-Wrapped.
# Agents may open PRs; this workflow decides whether they pass.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Unit tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        # 3.9 is the local venv, 3.11 is what the Dockerfile ships.
        python-version: ["3.9", "3.11"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        # requirements.txt is UTF-16 on this repo — normalize before pip.
        run: |
          python - <<'PY'
          from pathlib import Path
          raw = Path("requirements.txt").read_bytes()
          encoding = "utf-16" if raw[:2] in (b"\xff\xfe", b"\xfe\xff") else "utf-8"
          Path("requirements.ci.txt").write_text(raw.decode(encoding), encoding="utf-8")
          PY
          python -m pip install --upgrade pip
          pip install -r requirements.ci.txt

      - name: Compile check
        run: python -m compileall -q agents app core db integrations pipelines scripts server.py

      - name: Run unit suites
        # Framework-free suites; each file is runnable directly.
        # No Spotify / LLM / DB secrets required — tests use fakes.
        env:
          # Keep agent budget / provider defaults deterministic in CI.
          AGENT_DAILY_BUDGET_USD: "20.00"
          LLM_PROVIDER: openai
        run: |
          set -euo pipefail
          failed=0
          for t in tests/test_*.py; do
            echo "::group::$t"
            if ! python "$t"; then
              echo "::error file=$t::suite failed"
              failed=1
            fi
            echo "::endgroup::"
          done
          exit "$failed"

  static:
    name: Static checks
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Frontend module graph
        # No bundler here, so a broken import or a renamed export would
        # otherwise only surface when a browser loads the page.
        run: node scripts/check_frontend_modules.mjs

      - name: Secret scan (tracked files)
        # Cheap fail-closed check: no .env / token caches / sqlite DBs in git.
        run: |
          set -euo pipefail
          bad=$(git ls-files | grep -E '(^|/)\.env$|\.cache(-push)?$|\.db$|\.sqlite' || true)
          if [ -n "$bad" ]; then
            echo "::error::Sensitive paths are tracked:"
            echo "$bad"
            exit 1
          fi
          echo "No sensitive tracked paths."
